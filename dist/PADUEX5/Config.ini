V3.1.0.0:20261106
(1)Fix sensitivity lost after re-plug: firmware V3.1 writes the Sensi page to flash; host verifies every save by reading it back
V3.2.0.0:20261106
(1)Firmware V3.2: boot no longer resets the sensitivity table to 200 after loading it from flash (V3.1 wrote the page but lost it at power-up)
(2)Save now restarts the board (SET_MODE) and reads the table back after re-enumeration; the result is reported as flash-verified or lost
(3)Invalid GET_SENS replies are reported as errors instead of falling back to defaults; raw frames in PADUEX5.log
